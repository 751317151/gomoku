name: verify
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Java tests
        working-directory: gomoku-game/gomoku-game
        run: mvn -B test
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check gomoku-game/gomoku-game/src/main/resources/static/app.js
          while IFS= read -r file; do node --check "$file"; done < <(find gomoku-game/gomoku-game/docs/smoke -name '*.mjs' -type f -print)
      - name: Check static cache version
        shell: bash
        run: |
          set -euo pipefail
          versions=$(grep -oE '\?v=[0-9]+' gomoku-game/gomoku-game/src/main/resources/static/index.html | sort -u)
          test "$(printf '%s\n' "$versions" | sed '/^$/d' | wc -l)" -eq 1
      - name: Validate Compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.https.yml config --quiet
